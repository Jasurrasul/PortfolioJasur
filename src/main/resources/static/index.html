<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Min Portfolio</title>
    <!-- Valfritt: behåll din externa CSS om du redan har den -->
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
        /* Minimal fallback-stil om /css/styles.css saknas */
        body { font-family: system-ui, sans-serif; margin:0; line-height:1.5; background:#0f172a; color:#e5e7eb; }
        .container { max-width:1100px; margin:0 auto; padding:24px; }
        .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
        .card { background:#111827; border:1px solid #1f2937; border-radius:16px; padding:16px; box-shadow:0 10px 20px rgba(0,0,0,.2); }
        .project img { width:100%; height:160px; object-fit:cover; border-radius:12px; }
        .badge { display:inline-block; padding:2px 8px; border-radius:999px; border:1px solid #374151; margin:0 6px 6px 0; font-size:12px; }
        .btn { display:inline-block; padding:8px 12px; border-radius:10px; text-decoration:none; background:#22c55e; color:#052e16; font-weight:700; }
        label { display:grid; gap:6px; font-weight:600; }
        input, textarea { background:#0b1220; border:1px solid #1f2937; color:#e5e7eb; border-radius:10px; padding:10px; }
        button { background:#22c55e; border:none; color:#052e16; border-radius:10px; padding:10px 14px; font-weight:800; cursor:pointer; }
        .status { color:#9ca3af; min-height:20px; }
        footer { text-align:center; color:#9ca3af; }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 20px;
            margin-top: 30px;
            margin-bottom: 40px;
        }

        .avatar-wrap {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #22c55e;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #22c55e;
        }

        .header p {
            max-width: 600px;
            color: #cbd5e1;
            font-size: 1.1rem;
        }

    </style>
</head>
<body>
<header class="container header">
    <div class="avatar-wrap">
        <img class="avatar" src="images/profile.jpeg" alt="Jasur Rasulov" />
    </div>
    <div>
        <h1>Jasur Rasulov — Systemutvecklare inom Java</h1>
        <p>Här är min info om mig</p>
    </div>
</header>


<main class="container">
    <section>
        <h2>Mina Projekt</h2>
        <div id="projects" class="grid"></div>
    </section>

    <section>
        <h2>Kontakta mig</h2>
        <form id="contactForm" class="card">
            <label>
                Namn
                <input type="text" name="name" placeholder="Ditt namn" required maxlength="80" />
            </label>
            <label>
                E-post
                <input type="email" name="email" placeholder="din@epost.se" required maxlength="120" />
            </label>
            <label>
                Meddelande
                <textarea name="message" rows="5" placeholder="Skriv ditt meddelande..." required maxlength="2000"></textarea>
            </label>
            <button type="submit">Skicka</button>
            <p id="contactStatus" class="status" aria-live="polite"></p>
        </form>
    </section>
</main>

<footer class="container">
    <small>© <span id="year"></span> Jasur Rasulov</small>
</footer>

<!-- All JS inline i samma fil -->
<script>
    // --- DINA PROJEKT ---
    const projects = [
        {
            title: "Pensionats bokningsystem",
            image: "images/bokingsystem2.png",
            summary: "Spring Boot med Thymeleaf för att skapa bokningssystem",
            tech: ["Thymeleaf", "Spring Boot", "MySQL"],
            desc: "Boka kunder, hitta lediga rum och addera info om dem.",
            links: { code: "https://github.com/Jasurrasul/Pensionat.git" }
        },
        {
            title: "Webbutik-Tumaris",
            image: "images/shoppar-online.webp",
            summary: "JavaScript-baserad app med HTML-sidor",
            tech: ["JavaScript", "HTML", "CSS"],
            desc: "Köpa kläder på webbsidan",
            links: { code: "https://github.com/Jasurrasul/webbutik.git" }
        },
        {
            title: "Game-Snake",
            image: "images/snake.webp",
            summary: "Java-baserat spel med JPanel",
            tech: ["Java"],
            desc: "Klassiska Snake.",
            links: { code: "https://github.com/subdies/Grupp2_Snake.git" }
        },
        {
            title: "Safe-Inloggning",
            image: "images/login.jpg",
            summary: "Krypterad inloggning",
            tech: ["Java"],
            desc: "Säker inloggningssida.",
            links: { code: "https://github.com/Jasurrasul/securelogin.git" }
        }
    ];

    // --- RENDERA PROJEKT ---
    const grid = document.getElementById('projects');
    grid.innerHTML = projects.map(p => `
    <article class="card project">
      <img src="${p.image}" alt="${p.title}" onerror="this.style.display='none'"/>
      <div class="content">
        <h3>${p.title}</h3>
        <p class="summary">${p.summary}</p>
        <p class="desc">${p.desc}</p>
        <div class="tech">${(p.tech||[]).map(t=>`<span class="badge">${t}</span>`).join('')}</div>
        <p><a class="btn" href="${p.links?.code || '#'}" target="_blank" rel="noopener">Källkod</a></p>
      </div>
    </article>
  `).join('');

    // --- KONTAKT: POST /api/contact ---
    const form = document.getElementById('contactForm');
    const statusEl = document.getElementById('contactStatus');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        statusEl.textContent = 'Skickar...';
        const data = Object.fromEntries(new FormData(form).entries());
        try {
            const res = await fetch('/api/contact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (!res.ok) throw new Error('Nätverksfel');
            await res.json();
            statusEl.textContent = 'Tack! Meddelandet är skickat.';
            form.reset();
        } catch (err) {
            statusEl.textContent = 'Kunde inte skicka. Försök igen.';
        }
    });

    // --- FOOTER YEAR ---
    document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
